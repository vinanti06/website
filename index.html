<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Tech Institute | Future of Learning</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">NEXUS<span>TECH</span></div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#courses">Courses</a></li>
            <li><a href="#about">About</a></li>
            <li><button id="openLogin" class="login-trigger">Student Portal</button></li>
        </ul>
    </nav>

    <header class="hero-section">
        <div class="overlay"></div>
        <div class="hero-text">
            <h1>Master the Digital Frontier</h1>
            <p>Advanced Engineering & AI Research Labs</p>
            <div class="cta-group">
                <a href="#" class="btn primary">View Programs</a>
                <a href="#" class="btn secondary">Campus Tour</a>
            </div>
        </div>
    </header>

    <div class="modal-wrapper" id="loginModal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="form-container">
                <h2>Portal Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <label>Student ID</label>
                        <input type="text" id="userId" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="userPass" required>
                    </div>
                    <button type="submit" class="submit-btn">Authorize</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-grid">
            <div class="footer-info">
                <h3>Nexus Institute</h3>
                <p>Innovating education since 2010.</p>
            </div>
            <div class="footer-links">
                <p>&copy; 2026 Nexus Tech. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
