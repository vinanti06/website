<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regal Estate | Transparency in Alibag</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Regal Estate</div>
        <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Properties</a></li>
            <li><a href="#">Intelligence</a></li>
            <li><a href="#" id="loginBtn">Login</a></li>
        </ul>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>Expert Intelligence for Alibag Real Estate</h1>
            <p>Bringing transparency to property investments.</p>
            <button class="cta-btn">Explore Properties</button>
        </div>

        <div class="login-overlay" id="loginOverlay">
            <div class="login-box">
                <span class="close-btn">&times;</span>
                <h2>Partner Login</h2>
                <form id="authForm">
                    <input type="text" placeholder="Username" required>
                    <input type="password" placeholder="Password" required>
                    <button type="submit">Enter Portal</button>
                </form>
            </div>
        </div>
    </header>

    <footer>
        <p>&copy; 2026 Regal Estate Intelligence. All rights reserved.</p>
        <div class="socials">
            <span>LinkedIn</span> | <span>Twitter</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
